secrets:
- apiVersion: v1
  kind: Secret
  metadata:
    namespace: default
    name: bookstore-descriptor
  data:
    descriptor-set: ZGVzY3JpcHRvci1ieXRlcw==
gateways:
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    namespace: envoy-gateway
    name: gateway-1
  spec:
    gatewayClassName: envoy-gateway-class
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
httpRoutes:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    namespace: default
    name: httproute-1
  spec:
    hostnames:
    - www.example.com
    parentRefs:
    - namespace: envoy-gateway
      name: gateway-1
      sectionName: http
    rules:
    - matches:
      - path:
          value: "/foo"
      backendRefs:
      - name: service-1
        port: 8080
envoyextensionpolicies:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyExtensionPolicy
  metadata:
    namespace: default
    name: policy-for-http-route
  spec:
    targetRef:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: httproute-1
    protoMessageExtraction:
    - descriptorSetRef:
        group: ""
        kind: Secret
        name: bookstore-descriptor
        key: descriptor-set
      mode: FirstAndLast
      extractionByMethod:
        bookstore.Bookstore.GetShelf:
          requestExtractionByField:
            shelf: Extract
          responseExtractionByField:
            books: ExtractRepeatedCardinality
