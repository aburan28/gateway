{{- if .Values.spoke.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traffic-harvester.fullname" . }}-spoke
  namespace: {{ include "traffic-harvester.namespace" . }}
  labels:
    {{- include "traffic-harvester.spoke.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spoke.replicas }}
  selector:
    matchLabels:
      {{- include "traffic-harvester.spoke.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traffic-harvester.spoke.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "traffic-harvester.spoke.serviceAccountName" . }}
      containers:
        - name: spoke
          image: "{{ .Values.spoke.image.repository }}:{{ .Values.spoke.image.tag }}"
          imagePullPolicy: {{ .Values.spoke.image.pullPolicy }}
          env:
            - name: AGENT_IMAGE
              value: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
            {{- if .Values.spoke.hub.address }}
            - name: HUB_ADDRESS
              value: {{ .Values.spoke.hub.address | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.spoke.resources | nindent 12 }}
      {{- with .Values.spoke.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spoke.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

